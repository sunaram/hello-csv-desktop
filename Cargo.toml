[package]
name = "hellocsv"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Tiny cross-platform CSV/TSV viewer and editor that handles very large files"

[dependencies]
muda = "0.21.2"
tao = "0.37.1"
wry = "0.57.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
