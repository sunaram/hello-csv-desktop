name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - run: powershell -File packaging/msix/build.ps1
        env:
          # Partner Center > Product identity; set under Settings > Secrets and variables > Actions > Variables
          MSIX_IDENTITY: ${{ vars.MSIX_IDENTITY }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
      - shell: bash
        run: |
          mkdir dist
          cp target/release/hellocsv.exe packaging/msix/out/hellocsv.msix dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/hellocsv.exe
            dist/hellocsv.msix
